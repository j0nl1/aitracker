[package]
name = "aitracker"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "AI provider usage tracking CLI"
license = "MIT"
repository = "https://github.com/j0nl1/aitracker"
homepage = "https://github.com/j0nl1/aitracker"
keywords = ["ai", "usage", "tracking", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ait"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
dirs = "5"
dialoguer = "0.11"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
axum = "0.7"
base64 = "0.22"
ratatui = "0.28"
skillinstaller = { version = "0.1.0", features = ["interactive"] }
tower = { version = "0.5", features = ["util"] }
